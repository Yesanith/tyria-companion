name: tyria_codex
description: Guild Wars 2 companion app. Characters, account, trading post, world boss timers and the wiki.
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/
