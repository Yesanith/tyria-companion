name: Build recipe data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_recipes.py', '.github/workflows/data.yml']
  schedule:
    # first of the month, game data only changes with patches
    - cron: '0 4 1 * *'

permissions:
  contents: write

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build legendary recipe trees
        run: python tools/build_recipes.py en de fr

      - name: Commit if changed
        # tags check out a detached head, only branch runs can push back
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- assets/data; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "Yesanith"
          git config user.email "56350783+Yesanith@users.noreply.github.com"
          git add assets/data
          git commit -m "Regenerate legendary recipe data"
          git push origin HEAD:main
