name: Build recipe data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_recipes.py', 'tools/build_worldmap.py', '.github/workflows/data.yml']
  schedule:
    # first of the month, game data only changes with patches
    - cron: '0 4 1 * *'

permissions:
  contents: write

jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # one search index per language the api translates. turkish is absent on
      # purpose: AppLang.tr asks the api in english and reuses that index
      - name: Build legendary recipe trees
        run: python tools/build_recipes.py en de es fr

      - name: Build world map markers and overview tiles
        run: python tools/build_worldmap.py en de es fr

      - name: Commit if changed
        # tags check out a detached head, only branch runs can push back
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- assets/data && [ -z "$(git status --porcelain assets/tiles)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "Yesanith"
          git config user.email "56350783+Yesanith@users.noreply.github.com"
          git add assets/data assets/tiles
          git commit -m "Regenerate recipe and world map data"
          # the job runs for half an hour, main usually moved on meanwhile.
          # it only touches assets/data, so replaying it on top is safe
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1
