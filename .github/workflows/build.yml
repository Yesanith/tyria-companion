name: Build APK

on:
  # only tags, so a release is built once instead of twice per push
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.21.0
        required: true
      release:
        description: Also publish it as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # a tag carries the version, a manual run is asked for one. the input
      # travels through the environment rather than being pasted into the
      # script, so a stray character cannot run as shell
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1 ;;
          esac
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION ($GITHUB_RUN_NUMBER)"

      # android/ is not committed, generate it from the flutter template
      - name: Generate Android project
        run: flutter create --platforms=android --org com.yesanith --project-name tyria_codex .

      # sign with a real release key, the flutter template would use the
      # public debug key which scanners flag as a test build
      - name: Use the release signing key
        run: python3 ci/sign.py

      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Tyria Codex"#' "$M"

      - run: flutter pub get

      - name: Build APK
        env:
          VERSION: ${{ steps.version.outputs.value }}
          KEYSTORE_PATH: ${{ github.workspace }}/ci/release.keystore
          KEYSTORE_PASSWORD: TyriaCodex2026
          KEY_ALIAS: tyriacodex
          KEY_PASSWORD: TyriaCodex2026
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=APP_VERSION="$VERSION"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk tyria-codex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tyria-codex-apk
          path: tyria-codex.apk

      # a tag push always publishes, a manual run only when the box was ticked.
      # the release creates the tag itself, and because this runs with the
      # workflow's own token it does not trigger a second build
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          files: tyria-codex.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
