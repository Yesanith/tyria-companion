name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # every runner generates its own debug key, which would give every apk a
      # different signature and break installing over the previous version
      - name: Use the stable signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      # android/ is not committed, generate it from the flutter template
      - name: Generate Android project
        run: flutter create --platforms=android --org com.yesanith --project-name tyria_codex .

      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Tyria Codex"#' "$M"

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk tyria-codex.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tyria-codex-apk
          path: tyria-codex.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tyria-codex.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
